name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-driver/requirements.txt
      - name: Validate Compose
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile local-ai config --quiet
          docker compose -f docker-compose.offline.yml --env-file .env.example config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.example config --quiet
      - name: Build and test API
        run: |
          dotnet restore api-core/ApiCore/ApiCore/ApiCore.csproj
          dotnet build api-core/ApiCore/ApiCore/ApiCore.csproj -c Release --no-restore
          dotnet build api-core/ApiCore/ParserSmoke/ParserSmoke.csproj -c Release
          dotnet run --project api-core/ApiCore/ParserSmoke/ParserSmoke.csproj -c Release --no-build -- "doc/Эталон ответов Python.csv" "doc/Ответы студентов Python - Тест 1.csv"
          dotnet run --project api-core/ApiCore/ParserSmoke/ParserSmoke.csproj -c Release --no-build -- "example_data/001/Эталон ответов ЭК 001.xlsx" "example_data/001/Массив ответов 001_группа 1.xlsx"
          vertical_output=$(dotnet run --project api-core/ApiCore/ParserSmoke/ParserSmoke.csproj -c Release --no-build -- "example_data/005/005_Эталоны ответов.xlsx" "example_data/005/005_Массив ответов.xlsx")
          grep -q 'OK: 5 tests' <<< "$vertical_output"
          if dotnet run --project api-core/ApiCore/ParserSmoke/ParserSmoke.csproj -c Release --no-build -- "example_data/069/Эталон ответов 069.xlsx" "example_data/069/Массив ответов 069_группа 3.xlsx"; then
            echo "Expected unmatched benchmark question to fail" >&2
            exit 1
          fi
      - name: Test AI driver
        working-directory: ai-driver
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q .
          python -m unittest discover -s tests -v
          python -m pip check
          python -m py_compile ../scripts/*.py
      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Build production images
        run: |
          docker compose --env-file .env.example build
          docker compose --env-file .env.example --profile local-ai build local-llm
      - name: Reject generated and secret files
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__|node_modules|bin|obj|dist)/|\.py[co]$|^\.env$'; then
            echo "Generated or secret file is tracked" >&2
            exit 1
          fi
          git diff --check
