name: ai-checker

services:
  api-core:
    build:
      context: ./api-core/ApiCore/ApiCore
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME:?Set DB_NAME in .env};Username=${DB_USER:?Set DB_USER in .env};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      JwtSettings__Secret: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JwtSettings__Issuer: "${JWT_ISSUER:-AiCheckerApiCore}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-AiCheckerFrontend}"
      JwtSettings__ExpiryMinutes: "${JWT_EXPIRY_MINUTES:-60}"
      AiDriver__Url: http://ai-driver:8000
      Uploads__MaxRequestSizeMb: "${MAX_REQUEST_SIZE_MB:-100}"
      Uploads__MaxFileSizeMb: "${MAX_FILE_SIZE_MB:-50}"
      Uploads__MaxResponseFileCount: "${MAX_RESPONSE_FILE_COUNT:-50}"
      AnalysisQueue__Capacity: "${ANALYSIS_QUEUE_CAPACITY:-20}"
      AnalysisQueue__MaxAttempts: "${ANALYSIS_MAX_ATTEMPTS:-3}"
      AnalysisQueue__JobsDirectory: /var/lib/ai-checker/jobs
      AnalysisQueue__PipelineTimeoutSeconds: "${AI_PIPELINE_TIMEOUT_SECONDS:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      ai-driver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - analysis-jobs:/var/lib/ai-checker/jobs
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [app-network]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_OFFLINE_MODE: "false"
        VITE_ENABLED_MODELS: "${ENABLED_MODELS:-}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [app-network]

  postgres:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:?Set DB_NAME in .env}"
      POSTGRES_USER: "${DB_USER:?Set DB_USER in .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [app-network]

  ai-driver:
    build:
      context: ./ai-driver
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      SBERGPT_API_KEY: "${SBERGPT_API_KEY:-}"
      SBERGPT_BASE_URL: "${SBERGPT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1/}"
      SBERGPT_MODEL: "${SBERGPT_MODEL:-GigaChat-Pro}"
      ENABLE_LOCAL_LLM: "${ENABLE_LOCAL_LLM:-false}"
      LOCAL_LLM_MODE: "${LOCAL_LLM_MODE:-managed}"
      LOCAL_LLM_BASE_URL: "${LOCAL_LLM_BASE_URL:-http://local-llm:8080/v1}"
      LOCAL_LLM_MODEL: "${LOCAL_LLM_MODEL:-local-model}"
      LOCAL_LLM_API_KEY: "${LOCAL_LLM_API_KEY:-}"
      AI_PROVIDER_TIMEOUT_SECONDS: "${AI_PROVIDER_TIMEOUT_SECONDS:-360}"
      AI_MAX_OUTPUT_TOKENS: "${AI_MAX_OUTPUT_TOKENS:-1000}"
      AI_MAX_INPUT_CHARS: "${AI_MAX_INPUT_CHARS:-4000}"
      AI_CHECKPOINT_DIR: /app/checkpoints
      ALLOW_PROGRAMMATIC_FALLBACK: "${ALLOW_PROGRAMMATIC_FALLBACK:-false}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - analysis-checkpoints:/app/checkpoints
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [app-network]

  local-llm:
    profiles: [local-ai]
    build:
      context: ./llama-cpp
    restart: unless-stopped
    volumes:
      - "${LOCAL_LLM_MODELS_DIR:-./models}:/models:ro"
    environment:
      MODEL_PATH: "/models/${LOCAL_LLM_MODEL_FILE:-model.gguf}"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      N_CTX: "${LOCAL_LLM_CONTEXT_SIZE:-8192}"
      N_GPU_LAYERS: "${LOCAL_LLM_GPU_LAYERS:-0}"
      N_THREADS: "${LOCAL_LLM_THREADS:-8}"
      BATCH_SIZE: "${LOCAL_LLM_BATCH_SIZE:-512}"
      PARALLEL: "${LOCAL_LLM_PARALLEL:-1}"
      MODEL_ALIAS: "${LOCAL_LLM_MODEL:-local-model}"
      LOCAL_LLM_DISABLE_THINKING: "${LOCAL_LLM_DISABLE_THINKING:-}"
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [app-network]

volumes:
  postgres-data:
  analysis-jobs:
  analysis-checkpoints:

networks:
  app-network:
    driver: bridge
